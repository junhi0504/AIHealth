<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <title th:text="'AI 건강 상담 - ' + ${pageTitle}">AI 건강 상담</title>
    <th:block th:replace="~{layout :: head}"></th:block>
    <link rel="stylesheet" href="/css/consult.css"> <!-- ✅ 외부 CSS 연결 -->
</head>
<body>
<div th:fragment="content">
    <h1 class="consult-title">AI 건강 상담</h1>

    <div id="ai-consult-chat-box" class="chat-box"></div>

    <div class="input-wrapper">
        <textarea id="ai-consult-user-input" rows="3" placeholder="궁금한 건강 질문을 입력해주세요..."></textarea>
    </div>

    <div class="button-wrapper">
        <button onclick="sendMessage()">질문하기</button>
    </div>

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" id="csrf-token" />

    <script th:inline="javascript">
        /* <![CDATA[ */
        const csrfToken = /*[[${_csrf.token}]]*/ null;
        const csrfHeader = /*[[${_csrf.headerName}]]*/ null;

        function appendMessage(role, message) {
            const div = document.createElement("div");
            div.className = `ai-consult-message ${role}`;
            div.innerHTML = `<b>${role === 'user' ? '나' : 'AI'}</b>: ${message}`;
            const chatBox = document.getElementById("ai-consult-chat-box");
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById("ai-consult-user-input");
            const message = input.value.trim();
            if (!message) return;
            appendMessage("user", message);

            fetch("/consult/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(message)
            })
            .then(response => {
                if (response.status === 403) {
                    throw new Error("접근 권한이 없습니다. (403 Forbidden)");
                }
                return response.text();
            })
            .then(data => {
                appendMessage("ai", data);
            })
            .catch(error => {
                appendMessage("ai", "에러 발생: " + error.message);
            });

            input.value = "";
        }

        document.getElementById("ai-consult-user-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        document.querySelector('button').onmouseover = function() {
            this.style.backgroundColor = '#218838';
            this.style.transform = 'translateY(-2px)';
        }
        document.querySelector('button').onmouseout = function() {
            this.style.backgroundColor = '#28a745';
            this.style.transform = 'translateY(0)';
        }
        /* ]]> */
    </script>
</div>
</body>
</html>
