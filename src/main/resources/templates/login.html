<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 페이지</title>
    <style>
        /* --- 기존 스타일 (그대로 유지) --- */
        body {
          font-family: Arial, sans-serif;
          margin: 0;
          padding: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background-color: #f5f5f5;
        }
        .container {
          width: 400px;
          text-align: center;
        }
        .login-form {
          background: white;
          padding: 20px 40px;
          border-radius: 8px;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .login-form h2 {
          margin-bottom: 20px;
          color: #333;
        }
        .login-form input[type="text"],
        .login-form input[type="password"] {
          width: calc(100% - 22px);
          padding: 10px;
          margin-bottom: 15px;
          border: 1px solid #ddd;
          border-radius: 4px;
        }
        .login-form input[type="submit"] {
          width: 100%;
          padding: 10px;
          background-color: #4a90e2;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          font-size: 16px;
        }
        .login-form input[type="submit"]:hover {
          background-color: #357abd;
        }
        .signup {
          margin-top: 10px;
          font-size: 14px;
        }
        .signup a {
          color: #4a90e2;
          text-decoration: none;
        }
        .signup a:hover {
          text-decoration: underline;
        }

        /* --- ✨ [수정] 소셜 로그인 관련 스타일 --- */
        .social-login {
            margin-top: 20px;
            padding-top: 0; /* ✨ 위쪽 패딩 제거 */
            border-top: 1px solid #eee;
        }

        .social-login-title {
            font-size: 12px;
            color: #888;
            margin-top: 10px; /* ✨ 위쪽 여백 추가 (작대기와의 간격) */
            margin-bottom: 15px;
        }

        .social-login-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .social-login a img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            transition: opacity 0.2s ease;
        }
        .social-login a:hover img {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="container">
    <div th:if="${msg}" style="color: red;">
        <script>
            alert("[[${msg}]]");
        </script>
    </div>
    <div class="login-form">
        <form action="/member/login" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <h2>로그인</h2>
            <input type="text" placeholder="아이디" name="memberEmail" required>
            <input type="password" placeholder="비밀번호" name="memberPassword" required>
            <input type="submit" value="로그인">
            <div class="signup">
                회원이 아니신가요? <a href="/member/save">회원가입하기</a>
            </div>
        </form>
        <div class="social-login">
            <p class="social-login-title">소셜 로그인하기</p>

            <div class="social-login-buttons">
                <a href="/oauth2/authorization/kakao">
                    <img src="/images/kakao_login.png" alt="카카오 로그인"/>
                </a>
                <a href="/oauth2/authorization/naver">
                    <img src="/images/naver_login.png" alt="네이버 로그인"/>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
