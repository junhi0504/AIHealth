<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">

    <div class="inbody-input-container">

        <!-- 제목 -->
        <h1 class="page-title">인바디 정보 입력/수정</h1>

        <!-- 입력 폼 -->
        <form action="/inbody/save" method="post" class="inbody-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- 측정 날짜 -->

            <input type="date" id="measurementDate" name="measurementDate"
                   th:value="${inbodyRequest.measurementDate != null} ? ${inbodyRequest.measurementDate} : ${T(java.time.LocalDate).now()}"
                   required
                   onchange="onDateChange(this.value)" />

            <label for="height">키 (cm):</label>
            <input type="number" step="0.1" id="height" name="height" th:value="${inbodyRequest.height}" required />

            <label for="weight">몸무게 (kg):</label>
            <input type="number" step="0.1" id="weight" name="weight" th:value="${inbodyRequest.weight}" required />

            <label for="bodyFatPercentage">체지방률 (%):</label>
            <input type="number" step="0.1" id="bodyFatPercentage" name="bodyFatPercentage"
                   th:value="${inbodyRequest.bodyFatPercentage}" required />

            <label for="muscleMass">근육량 (kg):</label>
            <input type="number" step="0.1" id="muscleMass" name="muscleMass" th:value="${inbodyRequest.muscleMass}" required />

            <label for="visceralFatLevel">내장지방 레벨:</label>
            <input type="number" id="visceralFatLevel" name="visceralFatLevel" th:value="${inbodyRequest.visceralFatLevel}" required />

            <!-- 저장/수정 버튼 -->
            <button type="submit" th:text="${inbodyRequest.height != null} ? '수정' : '저장'">저장</button>
        </form>

    </div>

</div>

<script>
    // 날짜 선택 시 해당 날짜 데이터 조회
    function onDateChange(date) {
        if (date) {
            // 선택한 날짜를 query parameter로 보내서 Controller 호출
            window.location.href = '/inbody/input?date=' + date;
        }
    }
</script>
