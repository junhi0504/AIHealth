<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">

    <div class="inbody-input-container" style =margin-top: 10px>

        <h1>인바디 정보 입력/수정</h1>

        <form action="/inbody/save" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label for="height">키 (cm):</label>
            <input type="number" step="0.1" id="height" name="height" th:value="${inbodyRequest.height}" required />

            <label for="weight">몸무게 (kg):</label>
            <input type="number" step="0.1" id="weight" name="weight" th:value="${inbodyRequest.weight}" required />

            <label for="bodyFatPercentage">체지방률 (%):</label>
            <input type="number" step="0.1" id="bodyFatPercentage" name="bodyFatPercentage" th:value="${inbodyRequest.bodyFatPercentage}" required />

            <label for="muscleMass">근육량 (kg):</label>
            <input type="number" step="0.1" id="muscleMass" name="muscleMass" th:value="${inbodyRequest.muscleMass}" required />

            <label for="visceralFatLevel">내장지방 레벨:</label>
            <input type="number" id="visceralFatLevel" name="visceralFatLevel" th:value="${inbodyRequest.visceralFatLevel}" required />

            <label for="goal">운동 목표:</label>
            <select id="goal" name="goal">
                <option value="건강" th:selected="${inbodyRequest.goal == '건강'}">건강</option>
                <option value="다이어트" th:selected="${inbodyRequest.goal == '다이어트'}">다이어트</option>
                <option value="벌크업" th:selected="${inbodyRequest.goal == '벌크업'}">벌크업</option>
                <option value="린메스업" th:selected="${inbodyRequest.goal == '린메스업'}">린메스업</option>
            </select>

            <button type="submit" th:text="${inbodyRequest.height != null} ? '수정' : '저장'">저장</button>
        </form>
    </div>
</div>
</html>
