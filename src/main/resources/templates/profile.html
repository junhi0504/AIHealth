<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>프로필</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div th:fragment="content">
    <div sec:authorize="isAnonymous()">
        <div id="loginMessage">
            <p>로그인 후 이용해주세요.</p>
        </div>
        <script>
            window.location.href = '/member/login';
        </script>
    </div>

    <div sec:authorize="isAuthenticated()" class="container profile-main">
        <input type="hidden" id="memberId" th:value="${loginMember.id}" />

        <!-- 좌측 영역 -->
        <div class="left-container">
            <!-- 프로필 이미지 -->
            <div class="profile-image-container">
                <img id="profileImage" th:src="@{/images/profile.png}" alt="프로필 사진" class="profile-image">
                <div class="image-overlay">
                    <button class="overlay-button" id="changePhotoBtn">사진 변경</button>
                    <button class="overlay-button" id="deletePhotoBtn">사진 삭제</button>
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </div>

            <!-- 회원 이름 -->
            <h2 th:text="${loginMember.memberName} + '님 환영합니다!!'">님 환영합니다!!</h2>

            <!-- 최신 인바디 요약 -->
            <div class="inbody-summary" th:if="${inbodyList != null and !inbodyList.isEmpty()}">
                <h3>측정일: <strong th:text="${inbodyList.get(inbodyList.size() - 1).measurementDate}"></strong></h3>
                <p>
                    <span>키: <strong th:text="${#numbers.formatDecimal(inbodyList.get(inbodyList.size() - 1).height, 1, 1)}"></strong> cm</span><br>
                    <span>체중: <strong th:text="${#numbers.formatDecimal(inbodyList.get(inbodyList.size() - 1).weight, 1, 1)}"></strong> kg</span><br>
                    <span>골격근량: <strong th:text="${#numbers.formatDecimal(inbodyList.get(inbodyList.size() - 1).muscleMass, 1, 1)}"></strong> kg</span><br>
                    <span>체지방률: <strong th:text="${#numbers.formatDecimal(inbodyList.get(inbodyList.size() - 1).bodyFatPercentage, 1, 1)}"></strong> %</span><br>
                    <span>내장지방: <strong th:text="${inbodyList.get(inbodyList.size() - 1).visceralFatLevel}"></strong> LV</span><br>
                </p>
            </div>
            <div class="inbody-summary" th:if="${inbodyList == null or inbodyList.isEmpty()}">
                <p>등록된 인바디 정보가 없습니다.</p>
            </div>

            <!-- 버튼 그룹 -->
            <div class="button-group">
                <a href="/member/update">정보 수정</a>
                <a href="/inbody/input">인바디 수정</a>
                <a sec:authorize="hasRole('ADMIN')" href="/admin/members">모든 회원 조회</a>
            </div>
        </div>

        <!-- 우측 영역 -->
        <div class="right-container">
            <div class="right-top">
                <h3>오늘의 추천 식단</h3>
                <p th:text="${recommendation.dietRecommendation != null ? recommendation.dietRecommendation : '추천 식단 정보가 없습니다.'}">
                    불러오는 중...
                </p>
            </div>
            <div class="right-bottom">
                <h3>오늘의 운동</h3>
                <p th:text="${recommendation.exerciseRecommendation != null ? recommendation.exerciseRecommendation : '추천 운동 정보가 없습니다.'}">
                    불러오는 중...
                </p>
            </div>
        </div>
    </div>

    <!-- 그래프 & 테이블 -->
    <div id="graphTableWrapper">
        <div id="noDataMessage" style="text-align:center; display:none;">
            등록된 인바디 정보가 없습니다.
        </div>
        <div id="graphSection" class="graph-section" style="display:none;">
            <div class="graph-container">
                <h3>체중 변화</h3>
                <canvas id="weightChart"></canvas>
            </div>
            <div class="graph-container">
                <h3>골격근량 변화</h3>
                <canvas id="muscleChart"></canvas>
            </div>
            <div class="graph-container">
                <h3>체지방률 변화</h3>
                <canvas id="fatChart"></canvas>
            </div>
        </div>
            <!-- 테이블 섹션 -->
            <div id="tableSection" class="graph-container" style="display:none;">
                <h3>인바디 기록 조회</h3>
                <label for="datePicker">날짜 선택: </label>
                <input type="date" id="datePicker" />
                <button id="viewAllBtn" style="padding: 2px 8px; margin-left: 5px; cursor: pointer;">전체 보기</button>
                <table id="inbodyTable">
                    <thead>
                    <tr>
                        <th>측정일</th>
                        <th>키 (cm)</th>
                        <th>체중 (kg)</th>
                        <th>골격근량 (kg)</th>
                        <th>체지방률 (%)</th>
                        <th>내장지방 (LV)</th>
                    </tr>
                    </thead>
                    <tbody id="inbodyTableBody"></tbody>
                </table>
            </div>
        </div>

    <!-- Custom message box -->
    <div id="messageBox" class="message-box">
        <p id="messageText"></p>
        <div class="message-box-buttons">
            <button id="okBtn">확인</button>
            <button id="cancelBtn" style="display:none;">취소</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/js/profile.js}"></script>
</div>
</body>
</html>
