<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>프로필</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div th:fragment="content">
    <div sec:authorize="isAnonymous()">
        <div id="loginMessage">
            <p>로그인 후 이용해주세요.</p>
        </div>
        <script>
            // SyntaxError 해결: 전체 페이지를 새로고침하여 로그인 페이지로 이동
            window.location.href = '/member/login';
        </script>
    </div>

    <div sec:authorize="isAuthenticated()" class="container profile-main">
        <input type="hidden" id="memberId" th:value="${loginMember.id}" />

        <div class="left-container">
            <div class="profile-image-container">
                <img id="profileImage" th:src="@{/images/profile.png}" alt="프로필 사진" class="profile-image">
                <div class="image-overlay">
                    <button class="overlay-button" id="changePhotoBtn">사진 변경</button>
                    <button class="overlay-button" id="deletePhotoBtn">사진 삭제</button>
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </div>
            <h2 th:text="${loginMember.memberName} + '님 환영합니다!!'">님 환영합니다!!</h2>
            <div class="button-group">
                <a href="/member/update">정보 수정</a>
                <a href="/inbody/input">인바디 정보 입력/수정</a>
                <a sec:authorize="hasRole('ADMIN')" href="/admin/members">모든 회원 조회</a>
            </div>
        </div>

        <div class="right-container">
            <div class="right-top">
                <h3>오늘의 추천 식단</h3>
                <p th:text="${recommendation.dietRecommendation != null ? recommendation.dietRecommendation : '추천 식단 정보가 없습니다.'}">
                    불러오는 중...
                </p>
            </div>
            <div class="right-bottom">
                <h3>오늘의 운동</h3>
                <p th:text="${recommendation.exerciseRecommendation != null ? recommendation.exerciseRecommendation : '추천 운동 정보가 없습니다.'}">
                    불러오는 중...
                </p>
            </div>
        </div>
    </div>

    <div id="graphTableWrapper">
        <div id="noDataMessage" style="text-align:center; display:none;">
            등록된 인바디 정보가 없습니다.
        </div>
        <div id="graphSection" class="graph-section" style="display:none;">
            <div class="graph-container">
                <h3>체중 변화</h3>
                <canvas id="weightChart"></canvas>
            </div>
            <div class="graph-container">
                <h3>골격근량 변화</h3>
                <canvas id="muscleChart"></canvas>
            </div>
            <div class="graph-container">
                <h3>체지방률 변화</h3>
                <canvas id="fatChart"></canvas>
            </div>
        </div>
        <div id="tableSection" class="graph-container" style="display:none;">
            <h3>인바디 기록 조회</h3>
            <label for="datePicker">날짜 선택: </label>
            <input type="date" id="datePicker" />
            <button id="viewAllBtn" style="padding: 2px 8px; margin-left: 5px; cursor: pointer;">전체 보기</button>
            <table id="inbodyTable">
                <thead>
                <tr>
                    <th>측정일</th>
                    <th>체중 (kg)</th>
                    <th>골격근량 (kg)</th>
                    <th>체지방률 (%)</th>
                </tr>
                </thead>
                <tbody id="inbodyTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Custom message box for alerts and confirmations -->
    <div id="messageBox" class="message-box">
        <p id="messageText"></p>
        <div class="message-box-buttons">
            <button id="okBtn">확인</button>
            <button id="cancelBtn" style="display:none;">취소</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        /* <![CDATA[ */
        document.addEventListener('DOMContentLoaded', () => {
            let weightChart, muscleChart, fatChart;
            let fullInbodyData = [];
            const defaultProfileImage = '/images/profile.png';

            // Custom message box functions to replace alert() and confirm()
            function showMessage(text, isConfirm, callback) {
                const messageBox = document.getElementById('messageBox');
                const messageText = document.getElementById('messageText');
                const okBtn = document.getElementById('okBtn');
                const cancelBtn = document.getElementById('cancelBtn');

                messageText.textContent = text;
                okBtn.onclick = () => {
                    messageBox.style.display = 'none';
                    if (callback) callback(true);
                };

                if (isConfirm) {
                    cancelBtn.style.display = 'inline-block';
                    cancelBtn.onclick = () => {
                        messageBox.style.display = 'none';
                        if (callback) callback(false);
                    };
                } else {
                    cancelBtn.style.display = 'none';
                }

                messageBox.style.display = 'block';
            }

            const fileInput = document.getElementById('fileInput');
            const changePhotoBtn = document.getElementById('changePhotoBtn');
            const deletePhotoBtn = document.getElementById('deletePhotoBtn');
            const profileImageEl = document.getElementById('profileImage');

            // 로컬 스토리지에서 프로필 사진을 불러옵니다.
            const storedImage = localStorage.getItem('profileImage');
            if (storedImage) {
                profileImageEl.src = storedImage;
            }

            // Handle photo change via file input
            changePhotoBtn.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        profileImageEl.src = event.target.result;
                        // 사진 변경 시, 로컬 스토리지에 데이터 URL을 저장하여 페이지 이동 후에도 유지되도록 합니다.
                        localStorage.setItem('profileImage', event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Handle photo deletion using the custom message box
            deletePhotoBtn.addEventListener('click', () => {
                if (profileImageEl.src.endsWith(defaultProfileImage)) {
                    showMessage('이미 기본 이미지입니다.', false);
                    return;
                }
                showMessage('정말로 프로필 사진을 삭제하시겠습니까?', true, (result) => {
                    if (result) {
                        profileImageEl.src = defaultProfileImage;
                        fileInput.value = ''; // Reset the file input
                        // 로컬 스토리지에서도 사진을 삭제합니다.
                        localStorage.removeItem('profileImage');
                    }
                });
            });

            function formatDate(date) {
                if (!date) return '';
                const d = new Date(date);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            }

            function renderCharts(dates, weights, muscleMass, bodyFat) {
                const options = {
                    responsive: true,
                    maintainAspectRatio: false,
                    devicePixelRatio: 3,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                font: {
                                    size: 14,
                                    weight: 'bold'
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                autoSkip: true,
                                maxTicksLimit: 7,
                                font: {
                                    size: 12,
                                    weight: 'bold'
                                }
                            },
                            title: {
                                display: false,
                                font: {
                                    size: 14,
                                    weight: 'bold'
                                }
                            }
                        },
                        y: {
                            ticks: {
                                font: {
                                    size: 12,
                                    weight: 'bold'
                                }
                            },
                            title: {
                                display: false,
                                font: {
                                    size: 14,
                                    weight: 'bold'
                                }
                            }
                        }
                    }
                };

                if (weightChart) weightChart.destroy();
                if (muscleChart) muscleChart.destroy();
                if (fatChart) fatChart.destroy();

                weightChart = new Chart(document.getElementById('weightChart'), {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: '체중 (kg)',
                            data: weights,
                            borderColor: '#007bff',
                            backgroundColor: 'rgba(0,123,255,0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options
                });

                muscleChart = new Chart(document.getElementById('muscleChart'), {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: '골격근량 (kg)',
                            data: muscleMass,
                            borderColor: '#28a745',
                            backgroundColor: 'rgba(40,167,69,0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options
                });

                fatChart = new Chart(document.getElementById('fatChart'), {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: '체지방률 (%)',
                            data: bodyFat,
                            borderColor: '#dc3545',
                            backgroundColor: 'rgba(220,53,69,0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options
                });
            }

            function renderTable(dataToRender) {
                const tableBody = document.getElementById('inbodyTableBody');
                tableBody.innerHTML = '';

                if (dataToRender.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4">해당 날짜에 측정한 인바디 정보가 없습니다.</td></tr>`;
                    return;
                }

                dataToRender.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${formatDate(r.measurementDate)}</td>
                        <td>${(r.weight ?? 0).toFixed(1)}</td>
                        <td>${(r.muscleMass ?? 0).toFixed(1)}</td>
                        <td>${(r.bodyFatPercentage ?? 0).toFixed(1)}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            }

            async function fetchAndDisplayData() {
                const memberIdEl = document.getElementById('memberId');
                if (!memberIdEl) return;
                const memberId = memberIdEl.value;

                const graphSection = document.getElementById('graphSection');
                const tableSection = document.getElementById('tableSection');
                const noDataMessage = document.getElementById('noDataMessage');

                try {
                    const response = await fetch(`${window.location.origin}/main/profile/inbodyRecords/${memberId}`);
                    if (!response.ok) {
                        throw new Error(`데이터 요청 실패: HTTP 상태 코드 ${response.status}`);
                    }
                    fullInbodyData = await response.json();

                    if (!fullInbodyData || fullInbodyData.length === 0) {
                        graphSection.style.display = 'none';
                        tableSection.style.display = 'none';
                        noDataMessage.style.display = 'block';
                        return;
                    }

                    fullInbodyData.sort((a, b) => new Date(a.measurementDate) - new Date(b.measurementDate));

                    const recentDataForChart = fullInbodyData.slice(-7);

                    const dates = recentDataForChart.map(r => formatDate(r.measurementDate));
                    const weights = recentDataForChart.map(r => r.weight ?? 0);
                    const muscleMass = recentDataForChart.map(r => r.muscleMass ?? 0);
                    const bodyFat = recentDataForChart.map(r => r.bodyFatPercentage ?? 0);

                    const recentDataForTable = fullInbodyData.slice(-5).reverse();
                    renderTable(recentDataForTable);

                    renderCharts(dates, weights, muscleMass, bodyFat);

                    graphSection.style.display = 'flex';
                    tableSection.style.display = 'block';
                    noDataMessage.style.display = 'none';

                } catch (err) {
                    console.error("데이터 로딩 중 오류 발생:", err);
                }
            }

            const datePicker = document.getElementById('datePicker');
            if (datePicker) {
                datePicker.addEventListener('change', (e) => {
                    const selectedDate = e.target.value;
                    if (!selectedDate) {
                        const recentData = fullInbodyData.slice(-5).reverse();
                        renderTable(recentData);
                        return;
                    }
                    const filteredData = fullInbodyData.filter(r => formatDate(r.measurementDate) === selectedDate);
                    renderTable(filteredData);
                });
            }

            const viewAllBtn = document.getElementById('viewAllBtn');
            if (viewAllBtn) {
                viewAllBtn.addEventListener('click', () => {
                    datePicker.value = '';
                    renderTable(fullInbodyData.slice().reverse());
                });
            }

            fetchAndDisplayData();
        });
        /* ]]> */
    </script>
</div>
</body>
</html>
