<div th:fragment="content">
  <div class="write-container">
    <h1 class="write-h1">게시글 작성</h1>

    <div th:if="${isLogin}">
      <form class="write-form" th:action="@{/board/write}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- 제목 -->
        <label class="write-label">
          제목:
          <input type="text" name="title" class="write-input" required>
        </label>

        <!-- 내용 -->
        <label class="write-label">
          내용:
          <textarea name="content" class="write-textarea" required></textarea>
        </label>

        <!-- 이미지 영역 -->
        <div class="image-upload-container">
          <div id="imageDisplay" class="image-display"></div>
          <button type="button" id="addImageBtn">사진 추가</button>
          <input type="file" id="imageInput" accept="image/*" multiple style="display:none;">
        </div>

        <!-- hidden input -->
        <input type="hidden" id="imageData" name="imageData" />
        <button type="submit" class="write-submit-button">작성 완료</button>
      </form>
    </div>

    <div th:unless="${isLogin}">
      <h2>로그인 필수</h2>
      <p>게시글 작성을 위해 로그인이 필요합니다.</p>
      <a href="/member/login" class="write-login-button">로그인 하러 가기</a>
    </div>

    <a href="/board" class="write-back-link">← 목록으로</a>
  </div>
</div>

<!-- 공용 JS 연결 -->
<script th:src="@{/js/boardWrite.js}"></script>
