<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <head>
        <meta charset="UTF-8" />
        <title th:text="${board.title}">게시글</title>
        <link rel="stylesheet" th:href="@{/css/board_detail.css}" />
    </head>
    <body>

    <div class="container">
        <div class="post-container">

            <div class="post-header">
                <div class="post-title" th:text="${board.title}">제목</div>

                <div class="action-buttons" th:if="${isOwner}">
                    <a th:href="@{'/board/edit/' + ${board.id}}" class="edit-btn">✏ 수정</a>
                    <form th:action="@{'/board/' + ${board.id} + '/delete'}" method="post"
                          onsubmit="return confirm('삭제하시겠습니까?');" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="delete-btn">🗑 삭제</button>
                    </form>
                </div>
            </div>

            <div class="post-meta">
                <div class="post-info">
                    <span>작성자: <strong th:text="${board.memberName}">홍길동</strong></span>
                    <span>작성일: <strong th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</strong></span>
                </div>
                <div class="post-views">
                    조회수: <strong th:text="${board.viewCount}">123</strong>
                </div>
            </div>

            <div class="post-content">
                <div th:if="${board.images != null and !board.images.isEmpty()}" style="margin-bottom: 15px;">
                    <img th:each="img : ${board.images}" th:src="@{${img.filePath}}" th:alt="${img.fileName}"
                         style="max-width: 100%; height: auto; display: block; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ddd;" />
                </div>
                <div th:text="${board.content}"></div>
            </div>

            <div class="recommend-box">
                <button id="recommendBtn" class="recommend-btn" th:if="${loginMember}"
                        th:data-board-id="${board.id}"
                        th:data-csrf-token="${_csrf != null ? _csrf.token : ''}"
                        th:data-csrf-header="${_csrf != null ? _csrf.headerName : ''}">
                    <span class="emoji">👍</span>
                    <span class="label">추천</span>
                    <span id="recommendCount" class="count" th:text="${board.recommendCount}">0</span>
                </button>

                <button class="recommend-btn recommend-disabled" th:unless="${loginMember}" onclick="alert('로그인 후 이용 가능합니다.');">
                    <span class="emoji">👍</span>
                    <span class="label">추천</span>
                    <span class="count" th:text="${board.recommendCount}">0</span>
                </button>
            </div>

            <script th:src="@{/js/recommend.js}"></script>

            <div class="comments">
                <h3>💬 댓글</h3>

                <div th:if="${commentList != null and !commentList.isEmpty()}">
                    <div th:each="comment : ${commentList}" class="comment">
                        <div class="comment-meta">
                            <div>
                                <strong th:text="${comment.memberName}">작성자</strong>
                                <span th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                            </div>
                            <form th:if="${loginMember != null and (loginMember.role.name() == 'ADMIN' or loginMember.id == comment.memberId)}"
                                  th:action="@{'/comment/delete/' + ${comment.id}}" method="post"
                                  onsubmit="return confirm('댓글을 삭제하시겠습니까?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="delete-btn" title="댓글 삭제">🗑</button>
                            </form>
                        </div>
                        <div class="comment-content" th:text="${comment.content}">댓글 내용</div>
                    </div>
                </div>

                <div th:if="${commentList == null or commentList.isEmpty()}">
                    <p>아직 댓글이 없습니다.</p>
                </div>

                <div class="comment-form" th:if="${loginMember}">
                    <form id="commentForm" th:action="@{/comment/save}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="boardId" th:value="${board.id}" />
                        <textarea name="content" placeholder="댓글을 입력하세요..." required></textarea>
                        <button type="submit">댓글 작성</button>
                    </form>
                </div>
                <div class="comment-form" th:unless="${loginMember}">
                    <textarea placeholder="로그인 후 댓글을 작성할 수 있습니다." disabled></textarea>
                    <button type="button" onclick="alert('로그인 시 이용 가능합니다.');">댓글 작성</button>
                </div>
            </div>

        </div>

        <div class="footer">
            <a href="/board">← 목록으로</a>
        </div>

    </div>
    </body>
</div>
</html>
